networks:
  datahub:
    external: true

services:
  bihr-connector:
    build: .
    env_file:
      - .env
    networks:
      - default
      - datahub
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          # The full Products catalog (~180k rows, ~474 MB uncompressed JSON)
          # held in memory alongside the existing-rows ORM query needs real
          # headroom -- 512M OOM-killed mid-sync on first real deploy (2026-11-06).
          memory: 2048M

  bihr-connector-api:
    build: .
    env_file:
      - .env
    networks:
      - default
      - datahub
    restart: unless-stopped
    command: ["uvicorn", "bihr_connector.api:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          cpus: "1"
          # The full Products catalog (~180k rows, ~474 MB uncompressed JSON)
          # held in memory alongside the existing-rows ORM query needs real
          # headroom -- 512M OOM-killed mid-sync on first real deploy (2026-11-06).
          memory: 2048M
